<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090a0f" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Cliente libre de RTVE Play: televisión, directos y archivo de RTVE." />
    <!-- Sin referer hacia RTVE ni nadie: las peticiones no dicen desde dónde se hacen. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- iPhone y iPad: a pantalla completa desde la pantalla de inicio, con barra de estado opaca. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="OpenRTVE" />
    <!-- Conexiones abiertas antes de pedir nada: catálogo, imágenes y vídeo. -->
    <link rel="preconnect" href="https://www.rtve.es" crossorigin />
    <link rel="preconnect" href="https://api.rtve.es" crossorigin />
    <link rel="preconnect" href="https://img.rtve.es" />
    <title>OpenRTVE</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>OpenRTVE necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
